name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The no-clone install commands download these scripts from the latest release
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes install.sh uninstall.sh install.ps1 uninstall.ps1
        env:
          GH_TOKEN: ${{ github.token }}
